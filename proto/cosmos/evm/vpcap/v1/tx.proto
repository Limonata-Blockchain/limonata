syntax = "proto3";
package cosmos.evm.vpcap.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/cosmos/evm/x/vpcap/types";

// Msg defines the x/vpcap Msg service.
//
// x/vpcap enforces the per-validator CONSENSUS voting-power cap. Before this
// service existed the module had no Msg type at all, so its 4 params were
// writable only at InitGenesis: a mainnet born with the wrong cap (or born with
// enabled=false) could never be corrected without a coordinated binary upgrade.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams atomically REPLACES the x/vpcap params. Gov-gated: only the
  // x/gov module account (authority) may call it, so the decentralisation cap
  // can only be moved by a passed proposal - never by an admin key.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgUpdateParams atomically REPLACES the x/vpcap params. Gov-gated: only the
// x/gov module account (authority) may call it.
//
// params carries the JSON encoding of the module's Params struct - x/vpcap
// stores its params as JSON-in-store (not proto), exactly like x/encmempool and
// x/valgrant, so the whole struct is passed opaquely and re-decoded on chain.
// The handler runs the SAME validation used at genesis before writing, so an
// update can never install a cap the genesis path would have rejected.
//
// REPLACEMENT SEMANTICS (SDK convention): the JSON is decoded into a ZERO
// Params, so EVERY field must be supplied. A proposal that omits a field sets
// that field to its zero value - in particular omitting "enabled" TURNS THE CAP
// OFF. The handler therefore REFUSES an incomplete payload: every field of
// Params must appear explicitly, and unknown keys are refused too.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cosmos/evm/vpcap/MsgUpdateParams";

  // authority must be the x/gov module account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // params is the JSON-encoded replacement Params (see x/vpcap/types.Params).
  bytes params = 2;
}

message MsgUpdateParamsResponse {}
